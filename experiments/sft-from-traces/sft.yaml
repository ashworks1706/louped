# loupe train sft experiments/sft-from-traces/sft.yaml
# Relative paths are under LOUPE_HOME. dataset is what `loupe data curate --name sft-from-traces`
# writes. On a laptop GPU a 0.5B to 4B model fits in 4-bit; unsloth/Qwen3-4B with unsloth installed
# adds GGUF export (export.gguf_quant) for llama.cpp, Ollama or any GGUF server.
name: sft-from-traces
base_model: Qwen/Qwen2.5-0.5B-Instruct
dataset: data/sft-from-traces/sft.jsonl
output_dir: checkpoints/sft-from-traces
max_seq_length: 4096
load_in_4bit: true
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  epochs: 2
  per_device_batch_size: 1
  gradient_accumulation: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  logging_steps: 5
  seed: 3407
export:
  merge_as: sft-from-traces  # then loupe/sft-from-traces in evals, grids and the Playground
