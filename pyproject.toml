[project]
name = "loupelab"
version = "0.0.0"
description = "A research testbed for looking inside language models: interventions, evals, training and a UI over all of it"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "ashworks1706" }]
dependencies = [
    "pydantic>=2.10",
    "tyro>=0.9",
]

# One extra per capability. A module imports only its own extra's packages, so an install carries
# only what it uses. Later phases add rl, vllm and cluster.
[project.optional-dependencies]
# Reading and serving results. Pulls in the readers for both stores it serves.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "loupelab[evals,tracking]",
]
evals = [
    "inspect-ai>=0.3.271,<0.4",
]
# MLflow on a SQLite file; the file store is in maintenance mode in MLflow 3.
tracking = [
    "mlflow-skinny>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
interp = [
    "nnsight>=0.4",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "transformers>=5",
]
# LoRA SFT on TRL and PEFT, any device. On a CUDA GPU, also `pip install unsloth` for 4-bit
# QLoRA and GGUF export; loupe uses it when present.
train = [
    "loupelab[data,interp,tracking]",
    "datasets>=4",
    "peft>=0.17",
    "trl>=0.24",
]
# Training sets from product traces: the Phoenix source needs httpx, review needs rich.
data = [
    "httpx>=0.28",
    "pyyaml>=6",
    "rich>=14",
]
# Pretrained sparse autoencoders (Gemma Scope and the rest of SAELens's registry) for
# loupe.analysis.sae. Heavy: SAELens pulls in TransformerLens, wandb and plotly, so it is its own
# extra and nothing else imports it.
sae = [
    "loupelab[interp]",
    "sae-lens>=6",
]

[project.scripts]
loupe = "loupe.cli:main"

[project.entry-points.inspect_ai]
loupe = "loupe.inspect_ext._registry"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loupe"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]

# The layer rule. A package imports only packages below it; nothing imports up.
# Each later phase adds its layers here in the position ARCHITECTURE.md gives them.
[tool.importlinter]
root_package = "loupe"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "loupe.cli",
    "loupe.server",
    "loupe.train | loupe.sweep",
    "loupe.stores | loupe.tracking | loupe.analysis | loupe.inspect_ext",
    "loupe.interventions",
    "loupe.vectors",
    "loupe.models | loupe.data",
    "loupe.core",
]
