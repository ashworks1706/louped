[project]
name = "louped"
version = "0.4.0"
description = "A local testbed for research on LLM behavior and efficiency: experiments, evals, interventions, training and interpretability in one app"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "ashworks1706" }]
keywords = ["llm", "interpretability", "evals", "sycophancy", "mcp", "research", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.10",
    "tyro>=0.9",
]

[project.urls]
Homepage = "https://louped.vercel.app"
Documentation = "https://louped.vercel.app/docs"

# One extra per capability. A module imports only its own extra's packages, so an install carries
# only what it uses.
[project.optional-dependencies]
# Reading and serving results. Pulls in the readers for both stores it serves.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "louped[evals,tracking,sync,sources]",
]
# The project's sources/ (papers, docs, slides, notebooks): their text, read for search and
# quoting. PDF through PDFium (pypdfium2, Apache-2.0/BSD-3), not PyMuPDF (AGPL).
sources = [
    "httpx>=0.28",
    "nbformat>=5.10",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]
# Runs pushed to and pulled from a remote: any fsspec URL, Hugging Face Storage Buckets through
# huggingface_hub's hf://; S3 or R2 also needs s3fs.
sync = [
    "fsspec>=2024.6",
    "huggingface-hub>=1.33",
    "louped[evals,tracking]",
]
evals = [
    "inspect-ai>=0.3.271,<0.4",
    "inspect-evals>=0.22",
    # Inspect's openai-api provider: any local OpenAI-compatible server (llama-server, vLLM).
    "openai>=1.0",
]
# MLflow on a SQLite file; the file store is in maintenance mode in MLflow 3.
tracking = [
    "mlflow-skinny>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # MLflow's system metrics: GPU utilisation, memory and power through NVML (BSD), CPU and RAM
    # through psutil; a run without an NVIDIA GPU records CPU and RAM only.
    "nvidia-ml-py>=12; sys_platform != 'darwin'",
    "psutil>=5.9",
]
interp = [
    "nnsight>=0.4",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "transformers>=5",
]
# LoRA SFT on TRL and PEFT, any device. On a CUDA GPU, also `pip install unsloth` for 4-bit
# QLoRA and GGUF export; louped uses it when present.
train = [
    "louped[data,interp,tracking]",
    # 4-bit QLoRA on a CUDA GPU (load_in_4bit); unused on CPU.
    "bitsandbytes>=0.46.1; sys_platform != 'darwin'",
    "datasets>=4",
    "peft>=0.17",
    "trl>=1.14",
]
# Verifiable RL tasks and answer checks for GRPO: procedural tasks with their own scorers, and
# symbolic comparison of maths answers.
rl = [
    "louped[train]",
    "math-verify>=0.9",
    "reasoning-gym>=0.1.25",
]
# Training sets from logged model calls: the Phoenix source needs httpx, review needs rich.
data = [
    "httpx>=0.28",
    "pyyaml>=6",
    "rich>=14",
]
# The MCP server coding agents drive louped through: a stdio client of a running louped serve.
agent = [
    "httpx>=0.28",
    "mcp>=2.3",
]
# Retrieval: BM25 and dense search, a cross-encoder reranker, NLI for faithfulness.
rag = [
    "louped[interp]",
    "bm25s>=0.2",
    "sentence-transformers>=5",
]
# Pretrained sparse autoencoders (Gemma Scope and the rest of SAELens's registry) for
# louped.analysis.sae. Heavy: SAELens pulls in TransformerLens, wandb and plotly, so it is its own
# extra and nothing else imports it.
sae = [
    "louped[interp]",
    "sae-lens>=6",
]

[project.scripts]
louped = "louped.cli:main"

[project.entry-points.inspect_ai]
louped = "louped.inspect_ext._registry"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/louped"]

# hatch_build.py: the UI's static export goes in as louped/web when it has been built.
[tool.hatch.build.targets.wheel.hooks.custom]

# The source archive holds what builds the wheel: the package, its tests, the hook, and the UI's
# built export (not its sources or node_modules), so a wheel built from it carries the UI too.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/hatch_build.py", "/README.md", "/LICENSE", "/apps/web/out"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
# Runs in pyreft's own environment (older transformers), never against louped's.
exclude = ["src/louped/train/reft_worker.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]

# The layer rule. A package imports only packages below it; nothing imports up.
# Each later phase adds its layers here in the position ARCHITECTURE.md gives them.
[tool.importlinter]
root_package = "louped"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "louped.cli",
    "louped.server | louped.agent | louped.init",
    "louped.examples",
    "louped.train | louped.sweep | louped.grid | louped.sync | louped.features | louped.circuits | louped.judge | louped.derive | louped.bench | louped.endpoint_bench | louped.sources",
    "louped.stores | louped.tracking | louped.analysis | louped.inspect_ext",
    "louped.interventions",
    "louped.vectors",
    "louped.models | louped.data | louped.retrieval",
    "louped.core",
]
