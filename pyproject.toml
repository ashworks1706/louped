[project]
name = "loupelab"
version = "0.1.0"
description = "A local testbed for research on LLM behavior and efficiency: experiments, evals, interventions, training and interpretability in one app"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "ashworks1706" }]
keywords = ["llm", "interpretability", "evals", "sycophancy", "mcp", "research", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.10",
    "tyro>=0.9",
]

[project.urls]
Homepage = "https://github.com/ashworks1706/loupe"
Documentation = "https://github.com/ashworks1706/loupe/tree/main/apps/site/content/docs"
Issues = "https://github.com/ashworks1706/loupe/issues"

# One extra per capability. A module imports only its own extra's packages, so an install carries
# only what it uses.
[project.optional-dependencies]
# Reading and serving results. Pulls in the readers for both stores it serves.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "loupelab[evals,tracking]",
]
evals = [
    "inspect-ai>=0.3.271,<0.4",
    "inspect-evals>=0.22",
    # Inspect's openai-api provider: any local OpenAI-compatible server (llama-server, vLLM).
    "openai>=1.0",
]
# MLflow on a SQLite file; the file store is in maintenance mode in MLflow 3.
tracking = [
    "mlflow-skinny>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # MLflow's system metrics: GPU utilisation, memory and power through NVML (BSD), CPU and RAM
    # through psutil; a run without an NVIDIA GPU records CPU and RAM only.
    "nvidia-ml-py>=12; sys_platform != 'darwin'",
    "psutil>=5.9",
]
interp = [
    "nnsight>=0.4",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "transformers>=5",
]
# LoRA SFT on TRL and PEFT, any device. On a CUDA GPU, also `pip install unsloth` for 4-bit
# QLoRA and GGUF export; loupe uses it when present.
train = [
    "loupelab[data,interp,tracking]",
    # 4-bit QLoRA on a CUDA GPU (load_in_4bit); unused on CPU.
    "bitsandbytes>=0.46.1; sys_platform != 'darwin'",
    "datasets>=4",
    "peft>=0.17",
    "trl>=1.14",
]
# Verifiable RL tasks and answer checks for GRPO: procedural tasks with their own scorers, and
# symbolic comparison of maths answers.
rl = [
    "loupelab[train]",
    "math-verify>=0.9",
    "reasoning-gym>=0.1.25",
]
# Training sets from logged model calls: the Phoenix source needs httpx, review needs rich.
data = [
    "httpx>=0.28",
    "pyyaml>=6",
    "rich>=14",
]
# The MCP server coding agents drive loupe through: a stdio client of a running loupe serve.
agent = [
    "httpx>=0.28",
    "mcp>=2.3",
]
# Retrieval: BM25 and dense search, a cross-encoder reranker, NLI for faithfulness.
rag = [
    "loupelab[interp]",
    "bm25s>=0.2",
    "sentence-transformers>=5",
]
# Pretrained sparse autoencoders (Gemma Scope and the rest of SAELens's registry) for
# loupe.analysis.sae. Heavy: SAELens pulls in TransformerLens, wandb and plotly, so it is its own
# extra and nothing else imports it.
sae = [
    "loupelab[interp]",
    "sae-lens>=6",
]

[project.scripts]
loupe = "loupe.cli:main"

[project.entry-points.inspect_ai]
loupe = "loupe.inspect_ext._registry"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loupe"]

# hatch_build.py: the UI's static export goes in as loupe/web when it has been built.
[tool.hatch.build.targets.wheel.hooks.custom]

# The source archive holds what builds the wheel: the package, its tests, the hook, and the UI's
# built export (not its sources or node_modules), so a wheel built from it carries the UI too.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/hatch_build.py", "/README.md", "/LICENSE", "/apps/web/out"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
# Runs in pyreft's own environment (older transformers), never against loupe's.
exclude = ["src/loupe/train/reft_worker.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]

# The layer rule. A package imports only packages below it; nothing imports up.
# Each later phase adds its layers here in the position ARCHITECTURE.md gives them.
[tool.importlinter]
root_package = "loupe"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "loupe.cli",
    "loupe.server | loupe.agent | loupe.init",
    "loupe.examples",
    "loupe.train | loupe.sweep | loupe.grid | loupe.features | loupe.circuits | loupe.judge | loupe.bench | loupe.endpoint_bench",
    "loupe.stores | loupe.tracking | loupe.analysis | loupe.inspect_ext",
    "loupe.interventions",
    "loupe.vectors",
    "loupe.models | loupe.data | loupe.retrieval",
    "loupe.core",
]
