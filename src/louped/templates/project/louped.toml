# A louped research project. This file marks the project's root: louped commands run from any
# folder under it read experiments/ here and keep their state in .louped/ here.

# Where `louped push` and `louped pull` share runs. Runs → Connect, or a first `louped push`,
# sets it up: a private Hugging Face bucket of your own unless you name another (a folder here,
# or s3://... for R2).
# remote = "hf://buckets/<user>/<name>"

# The domains an experiment's README can name, each on an axis (behavior, efficiency or checks),
# in the order the Experiments page shows them. Without this table a project has louped's own:
# mechanisms, honesty, conditioning, agents (behavior); context, inference, specialisation
# (efficiency); reproduction (checks). Uncomment to list your own instead.
#
# [domains.honesty]
# axis = "behavior"
# title = "Sycophancy and honesty"
#
# [domains.reproduction]
# axis = "checks"
# title = "Reproducing known results"
