name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which halves of the gate a change needs. A manual run needs both.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      site: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.site == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'hatch_build.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'justfile'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'src/loupe/server/**'
              - 'src/loupe/stores/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            site:
              - 'apps/site/**'
              - 'justfile'
              - '.github/workflows/ci.yml'

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --locked --all-extras
      - run: just check-python

  web:
              - 'apps/web/**'
              - 'src/loupe/server/**'
              - 'src/loupe/stores/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            site:
              - 'apps/site/**'
              - 'justfile'
              - '.github/workflows/ci.yml'

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --locked --all-extras
      - run: just check-python

  # The roadmap's acceptance "a fresh user runs an example from a clean clone": the worked examples
  # from the docs, on their tiny offline models, from a fresh checkout and a locked install.
  examples:
    name: Examples
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --locked --all-extras
      - run: just examples

  # The roadmap's first-five-minutes path, as a pip user meets it: the wheel built with its UI,
  # installed in an empty folder, `loupe init`, the example on its offline model, `loupe serve`.
  install:
    name: Install
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: corepack enable && cd apps/web && pnpm install --frozen-lockfile
      - run: just web-build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: uv build --wheel
      - run: unzip -l dist/*.whl | grep -q 'loupe/web/index.html'
      - run: bash scripts/install-check.sh dist/*.whl

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      # The UI's API types must match the server's schema.
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: extractions/setup-just@v4
      - run: uv sync --locked --extra server && just api-types && git diff --exit-code src/lib/
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Screenshots of every page, desktop and mobile, for reviewing a UI change in the PR.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: extractions/setup-just@v4
      - run: corepack enable && cd apps/site && pnpm install --frozen-lockfile
      - run: just check-site

  # The one required check. It passes when every job that ran passed and the rest were skipped.
  ci:
    name: CI
    if: always()
    needs: [changes, python, install, web, site]
    runs-on: ubuntu-latest
    steps:
      - run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          echo "$results" | grep -qE '"(failure|cancelled)"' && exit 1 || exit 0
