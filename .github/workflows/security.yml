name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  # Code scanning and dependency review need GitHub Advanced Security, free on public repositories.
  codeql:
    name: CodeQL
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv export --locked --all-extras --no-emit-project --format requirements-txt > requirements.txt
      # PYSEC-2026-3740: nltk (via sae-lens) model-path sandbox bypass; no fix released, and louped
      # calls no nltk parser or tagger.
      - run: uvx pip-audit --strict -r requirements.txt --ignore-vuln PYSEC-2026-3740
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable && pnpm audit --prod --audit-level high
        working-directory: apps/web

  review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
