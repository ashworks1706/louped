name: Release

on:
  push:
    tags: ["v*"]
  # A tag release-please creates with GITHUB_TOKEN starts no workflow, so it dispatches this one;
  # also how a maintainer reruns a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build and publish, such as v0.1.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # The wheel carries the UI (hatch_build.py), so it is built first.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: extractions/setup-just@v4
      - run: corepack enable && cd apps/web && pnpm install --frozen-lockfile
      - run: just web-build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - run: unzip -l dist/*.whl | grep -q 'louped/web/index.html'
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # PyPI trusted publishing: no token. Configure once on PyPI for this repo and the `pypi`
  # environment; until then this job fails and nothing else is affected.
  pypi:
    name: PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
