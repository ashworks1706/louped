name: Site

# The landing page and docs on GitHub Pages. Enable Pages with source "GitHub Actions" once;
# with a custom domain set there, the site is served at its root.
on:
  push:
    branches: [main]
    paths: ["apps/site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_APP_URL: ${{ vars.LOUPE_APP_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/site/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
