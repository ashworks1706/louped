name: Release PR

# Opens and updates the version-bump and changelog pull request from conventional commits.
# Merging it creates the tag, which release.yml publishes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Its tag starts no workflow (GITHUB_TOKEN's events do not), so start the release by hand.
      - if: ${{ steps.release.outputs.release_created }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
