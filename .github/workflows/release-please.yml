name: Release PR

# Opens and updates the version-bump and changelog pull request from conventional commits.
# Merging it creates the tag, which release.yml publishes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
